<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) { originalFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Failed to inject fetch setter wrapper:', e);
        }
        try {
          var theme = localStorage.getItem('theme') || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var savedLang = localStorage.getItem('lang') || 'en';
          document.documentElement.lang = savedLang;
          if (localStorage.getItem('challan_disable_transitions') === 'true') {
            document.documentElement.classList.add('reduce-motion');
          }
        } catch (e) {}
        try {
          window.__deferredInstallPrompt = null;
          window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            window.__deferredInstallPrompt = e;
            window.dispatchEvent(new CustomEvent('challan-install-prompt-ready'));
          });
          window.addEventListener('appinstalled', function() {
            window.__deferredInstallPrompt = null;
            window.__pwaInstalled = true;
            window.dispatchEvent(new CustomEvent('challan-app-installed'));
          });
        } catch (e) {}
      })();
    </script>
