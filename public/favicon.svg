<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Deep Smoked Obsidian Base -->
    <radialGradient id="obsidianBase" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0F1F22" />
      <stop offset="100%" stop-color="#070C14" />
    </radialGradient>

    <!-- Luminous Emerald Aurora Orb -->
    <radialGradient id="emeraldAurora" cx="28%" cy="24%" r="68%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.92" />
      <stop offset="45%" stop-color="#059669" stop-opacity="0.52" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Secondary Subtle Depth Bloom -->
    <radialGradient id="tealDepth" cx="72%" cy="76%" r="52%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="medallionRim" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.78" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.65" />
    </linearGradient>

    <!-- Crisp Drop Shadow for Ledger Mark -->
    <filter id="iconRelief" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#02120E" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Circular Medallion Surface -->
  <circle cx="256" cy="256" r="245" fill="url(#obsidianBase)" />
  <circle cx="256" cy="256" r="245" fill="url(#emeraldAurora)" />
  <circle cx="256" cy="256" r="245" fill="url(#tealDepth)" />

  <!-- Outer Specular Rim -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#medallionRim)" stroke-width="4" />

  <!-- Refined BookOpen Mark -->
  <g filter="url(#iconRelief)" transform="translate(141, 144) scale(9.6)" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
  </g>
</svg>
