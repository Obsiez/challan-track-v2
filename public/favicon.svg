<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Crisp Emerald Radial Gradient -->
    <radialGradient id="medallionBg" cx="32%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="70%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </radialGradient>

    <!-- Pronounced Dual-Tone Rim Border -->
    <linearGradient id="medallionRim" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Inner Bezel Ring -->
    <linearGradient id="innerBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    <!-- Fine Guilloche Micro-Texture Pattern -->
    <pattern id="microTexture" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8 L8 0 L16 8 L8 16 Z" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.08" />
      <circle cx="8" cy="8" r="1" fill="#FFFFFF" fill-opacity="0.12" />
    </pattern>

    <!-- Sharp Drop Shadow for Icon Mark -->
    <filter id="iconRelief" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#022C22" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Medallion Base -->
  <circle cx="256" cy="256" r="248" fill="url(#medallionBg)" />

  <!-- Tactile Micro-Texture Overlay -->
  <circle cx="256" cy="256" r="248" fill="url(#microTexture)" />

  <!-- Inner Bezel Ring for Depth -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#innerBezel)" stroke-width="3" />

  <!-- Outer Sharp Medallion Rim -->
  <circle cx="256" cy="256" r="247" fill="none" stroke="url(#medallionRim)" stroke-width="5" />

  <!-- Bold, Pronounced Book-Open Ledger Mark -->
  <g filter="url(#iconRelief)" transform="translate(106, 112) scale(12.5)" fill="none" stroke="#FFFFFF" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
  </g>
</svg>
