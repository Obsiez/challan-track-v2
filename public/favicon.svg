<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Deep Smoked Obsidian Glass Base -->
    <radialGradient id="obsidianBase" cx="50%" cy="50%" r="54%">
      <stop offset="0%" stop-color="#0D1F21" />
      <stop offset="68%" stop-color="#081218" />
      <stop offset="100%" stop-color="#050910" />
    </radialGradient>

    <!-- Primary Luminous Emerald Aurora Orb -->
    <radialGradient id="emeraldAurora" cx="27%" cy="24%" r="68%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.96" />
      <stop offset="28%" stop-color="#10B981" stop-opacity="0.86" />
      <stop offset="62%" stop-color="#059669" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Secondary Cyan-Teal Glass Refraction -->
    <radialGradient id="tealDepth" cx="78%" cy="76%" r="54%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.52" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Convex Upper-Left Glass Sheen -->
    <radialGradient id="glassDomeSheen" cx="34%" cy="14%" r="44%">
      <stop offset="0%" stop-color="#ECFDF5" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ECFDF5" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Specular Glass Rim -->
    <linearGradient id="medallionRim" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#D1FAE5" stop-opacity="0.82" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.65" />
    </linearGradient>

    <!-- Inner Glass Bevel Highlight -->
    <linearGradient id="innerBevelRim" x1="18%" y1="12%" x2="82%" y2="88%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.06" />
    </linearGradient>

    <!-- Multi-Layered Elevation Shadow for Ledger Mark -->
    <filter id="iconRelief" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020C0A" flood-opacity="0.42" />
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#02120E" flood-opacity="0.52" />
    </filter>
  </defs>

  <!-- Circular Medallion Glass Surface (Zero outer square background) -->
  <circle cx="256" cy="256" r="251" fill="url(#obsidianBase)" />
  <circle cx="256" cy="256" r="251" fill="url(#emeraldAurora)" />
  <circle cx="256" cy="256" r="251" fill="url(#tealDepth)" />
  <circle cx="256" cy="256" r="251" fill="url(#glassDomeSheen)" />

  <!-- Recessed Inner Bevel & Specular Rim -->
  <circle cx="256" cy="256" r="241" fill="none" stroke="#030E0C" stroke-opacity="0.38" stroke-width="3" />
  <circle cx="256" cy="256" r="238" fill="none" stroke="url(#innerBevelRim)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="249" fill="none" stroke="url(#medallionRim)" stroke-width="4" />

  <!-- Floating Frosted BookOpen Folio Mark -->
  <g filter="url(#iconRelief)" transform="translate(141, 143) scale(9.6)" stroke="#FFFFFF" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" fill="#ECFDF5" fill-opacity="0.09" />
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" fill="#ECFDF5" fill-opacity="0.09" />
  </g>
</svg>
